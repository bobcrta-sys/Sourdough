name: Daily visitor stats

on:
  schedule:
    - cron: "17 10 * * *"   # about 5:17 am Eastern
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/stats.py
      - name: Save stats
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "Visitor stats for $(date -d yesterday +%F)"
          git push
